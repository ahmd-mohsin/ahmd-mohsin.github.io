// ------------------------------------------------------------------------------------------------ content
// Seven tiers. Every station has a short role and the rules it enforces. Copy follows the site rules.
const ZONES = [
  { id: 'z1', name: 'Request and intent', say: 'The customer states the goal. The goal becomes one named behaviour, and the test set is sealed before any training task exists.' },
  { id: 'z2', name: 'Ground truth', say: 'Scouts find real code and real history. Real history becomes the answer key, so no check is invented.' },
  { id: 'z3', name: 'The swarm', say: 'Separate agents plan, build the world, build the reference solution and write the hidden checks. No agent grades its own work.' },
  { id: 'z4', name: 'Verifier gates', say: 'Executed gates run from the cheapest to the most costly. A task passes only with evidence that its grader can fail and that it is fair.' },
  { id: 'z5', name: 'Targeting', say: 'The target model attempts the task. A counterfactual run proves that the model fails on the intended skill and not on something else.' },
  { id: 'z6', name: 'Environment and training', say: 'Each accepted task becomes an environment. Long attempts stay coherent, each step gets its credit, and many worlds train the model at once.' },
  { id: 'z7', name: 'Measurement and improvement', say: 'The sealed set measures the improvement. Audits of every trace repair the checks, find new intents and improve the factory itself.' },
];
const K = { input: 'input', role: 'role', gate: 'gate', store: 'store', compute: 'compute', out: 'out' };
const NODES = [
  ['z1', 'request', 'Request', K.input, 'The customer states the goal.', [

    'The prompt says which environments the customer needs.', 'An enterprise also gives access to its records and its experts.',
    'The first version needs only the prompt.']],
  ['z1', 'intent', 'Intent card', K.store, 'One named behaviour to improve.', [
    'The card names the behaviour in one sentence.', 'The card cites real failure traces as evidence.',
    'The card lists the real axes of difficulty.', 'A person approves the card before any build starts.']],
  ['z1', 'bench', 'Sealed benchmark', K.store, 'The test set comes first.', [
    'Held-out sources share no repository and no owner with training sources.', 'Held-out work ends after a fixed cutoff date.',
    'A hashed manifest seals the set.', 'No agent that builds training tasks can read it.']],
  ['z2', 'scouts', 'Scouts', K.role, 'Many small agents search public code.', [
    'They search repositories, commits, issues and pull requests.', 'They expand their queries from the intent card.',
    'They keep typed records of real changes, fixes, requests and users of a library.',
    'Licence, size and a test run filter each source before any model call.']],
  ['z2', 'lanes', 'Ground truth lanes', K.store, 'Real history becomes the answer key.', [
    'A release window turns real commits into milestones.', 'A stitched window joins a library and the projects that use it.',

  ['z3', 'curator', 'Root curator', K.role, 'Directs the work and writes no tasks.', [
    'It leases empty cells of the coverage matrix.', 'It stops a cell when new tasks stop arriving.',
    'No single idea may fill more than 40 percent of a family.', 'It merges only tasks that pass every gate.']],
  ['z3', 'planner', 'Planner', K.role, 'Designs the milestone graph.', [

  ['z3', 'worldx', 'World expert', K.role, 'Builds the sandbox.', [

  ['z3', 'oracle', 'Oracle builder', K.role, 'Writes the reference solution.', [
    'It works in a private copy of the code.', 'It makes one commit for each milestone.',
    'Its commits never reach the verifier writer.']],
  ['z3', 'vwriter', 'Verifier writer', K.role, 'Writes the hidden checks.', [
    'It never sees a solution.', 'It writes one group of checks for each requirement.',
    'Each check tests behaviour and never the text of the code.']],
  ['z3', 'author', 'Prompt author', K.role, 'Writes the request in a real voice.', [

    'A reviewer from another model family removes unrealistic hints.']],
  ['z3', 'taskrepo', 'Task repository', K.store, 'The shared memory of the swarm.', [
    'Each contribution is an immutable commit with links to its sources.', 'Agents announce their scope before work, so duplicates stop early.',
    'A hand-off carries the full specification and never only a summary.']],
  ['z4', 'deps', 'Dependency check', K.gate, 'Proves that the task is long and not only large.', [
    'A milestone depends on another only if the code shows it.', 'Text overlap is never enough.',
    'A window with no real dependency leaves the long track.']],
  ['z4', 'floors', 'Floors and mutants', K.gate, 'Proves that the grader can fail.', [

    'The reference solution scores one.']],
  ['z4', 'v2', 'Second verifier', K.gate, 'An independent check of the checks.', [

  ['z4', 'alts', 'Valid alternatives', K.gate, 'A fair grader accepts every correct solution.', [

  ['z4', 'flake', 'Flake gate', K.gate, 'The grader gives the same answer each time.', [

  ['z4', 'hackers', 'Hackers', K.role, 'Agents try to win without the work.', [

  ['z4', 'gold', 'Gold set', K.store, 'Measures the error of the grader.', [

  ['z5', 'solvers', 'Solvers', K.compute, 'The target model attempts the task.', [

  ['z5', 'counter', 'Counterfactual control', K.gate, 'Proves that the failure is the intended one.', [

    'Four measured tasks failed a frontier model on every full attempt and passed on every simplified attempt.']],
  ['z5', 'band', 'Band and causes', K.gate, 'The task must teach.', [

  ['z5', 'accepted', 'Accepted task', K.out, 'A task that passed every gate.', [

  ['z6', 'env', 'Environment', K.store, 'One task becomes one environment.', [

    'A lost container is a system fault and never a zero score.', 'A group with a system fault is dropped as a whole.']],
  ['z6', 'harness', 'Recursive harness', K.compute, 'Keeps the agent coherent over very long work.', [
    'The full history lives in a ledger outside the context window.', 'The agent reads its history back through code.',
    'Compaction is a trained action.', 'Helper agents and snapshots carry work across sessions.']],
  ['z6', 'checkpt', 'Checkpoint grading', K.gate, 'Measures progress during the attempt.', [
    'Hidden checks run on snapshots at commits and at each compaction.', 'The agent never sees the results.',

  ['z6', 'credit', 'Credit assignment', K.compute, 'Each step gets the credit it earned.', [
    'Progress is a score over verified milestones.', 'Each step receives the change in that score.',

  ['z6', 'honesty', 'Honesty', K.gate, 'The agent states what it finished.', [
    'The agent rates each requirement it believes it met.', 'A proper score rewards a true belief.',
    'The agent can stop and say that it cannot finish.', 'This term never turns a failure into a reward.']],
  ['z6', 'async', 'Asynchronous rollouts', K.compute, 'Many worlds run at once.', [
    'Inference engines serve many attempts in parallel.', 'Each token keeps its exact identity and probability.',
    'A bound on staleness limits off-policy data.', 'Corrections handle data from older weights.']],
  ['z6', 'trainer', 'Trainer', K.compute, 'Updates the weights on many GPUs.', [
    'Advantages compare attempts of the same task.', 'Turn credit flows to each token of that turn.',
    'Each checkpoint records the grader version that scored it.']],
  ['z7', 'measure', 'Benchmark run', K.out, 'Shows if the model improved.', [
    'The sealed set runs before and after training.', 'Reports show success at least once and success every time.',
    'The comparison pairs each task with itself.', 'Reports state the smallest effect that the test can detect.']],
  ['z7', 'audit', 'Trace audit', K.role, 'Reads every attempt, the passes too.', [

  ['z7', 'accept', 'Executed acceptance', K.gate, 'A fix needs evidence and not opinion.', [

  ['z7', 'newintent', 'Intent update', K.role, 'New failures become new intents.', [

  ['z7', 'receipts', 'Receipts', K.store, 'The factory proves that it works.', [

const LOOPS = [
  ['accept', 'vwriter', 'Verified fixes'],
  ['newintent', 'intent', 'New intents'],
  ['recipe', 'curator', 'Better recipe'],
  ['trainer', 'solvers', 'New weights'],
  ['floors', 'vwriter', 'Failed gate returns'],
  ['counter', 'planner', 'Wrong difficulty returns'],

// ------------------------------------------------------------------------------------------------ scene
const host = document.getElementById('stage');
const PAL = { cardinal: 0x8c1515, ember: 0xc8473f, blush: 0xf2dcdc, ink: 0x2e2d29, grey: 0x53565a, stone: 0x8a8380,

catch (e) { document.getElementById('fallback').style.display = 'block'; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 40, 85);
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);

ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
{ // dotted floor
  const pts = []; for (let x = -16; x <= 16; x += 0.8) for (let z = -16; z <= 16; z += 0.8) if (x * x + z * z < 256) pts.push(x, 0.002, z);

  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: PAL.rule, size: 2, sizeAttenuation: false })));

const M = {
  clay: c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.62, metalness: 0.0 }),
  gloss: c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.25, metalness: 0.1 }),
  glass: () => new THREE.MeshPhysicalMaterial({ color: PAL.glass, roughness: 0.15, transmission: 0.55, thickness: 0.4, transparent: true, opacity: 0.55 }),

const edge = (mesh, color = PAL.rule) => { const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 20), new THREE.LineBasicMaterial({ color, transparent: true })); mesh.add(e); return mesh; };
const roundBox = (w, h, d, r) => {
  const s = new THREE.Shape(); const x = -w / 2, z = -d / 2;
  s.moveTo(x + r, z); s.lineTo(x + w - r, z); s.quadraticCurveTo(x + w, z, x + w, z + r); s.lineTo(x + w, z + d - r);

// Layout: a rising spiral of seven tiers around a central record store.
const R = 11.2, STEP = (2 * Math.PI) / 7.4, RISE = 0.62, A0 = Math.PI * 0.12, GAP = 1.9;
const zoneGeo = {};
const nodeObj = {};
ZONES.forEach((z, i) => {
  const th = A0 + i * STEP, y = 0.25 + i * RISE;
  const c = new THREE.Vector3(R * Math.cos(th), y, R * Math.sin(th));
  const t = new THREE.Vector3(-Math.sin(th), 0, Math.cos(th));
  const r = new THREE.Vector3(Math.cos(th), 0, Math.sin(th));
  const nodes = NODES.filter(n => n.zone === z.id);
  const cols = Math.min(nodes.length, 4), rows = Math.ceil(nodes.length / 4);
  const W = cols * GAP + 0.7, D = rows * GAP + 0.6;
  // pedestal column under the tier
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, y, 12), M.clay(PAL.rule));
  col.position.set(c.x, y / 2, c.z); col.castShadow = true; scene.add(col);
  const plate = new THREE.Mesh(roundBox(W, 0.16, D, 0.25), M.glass());
  plate.position.copy(c); plate.position.y = y - 0.16;
  plate.rotation.y = -th - Math.PI / 2; // local x along the tangent, local z along the radius
  plate.receiveShadow = true; scene.add(plate);
  edge(plate, 0xe2dcd9);
  // a red rim on the outer edge of the plate
  const rim = new THREE.Mesh(new THREE.BoxGeometry(W - 0.5, 0.05, 0.05), M.gloss(PAL.cardinal));
  rim.position.copy(c).addScaledVector(r, D / 2 - 0.02); rim.position.y = y + 0.01;
  rim.rotation.y = -th - Math.PI / 2; scene.add(rim);
  const zl = label(`${i + 1}  ${z.name}`, 'zlab', c.clone().addScaledVector(r, D / 2 + 0.75).add(new THREE.Vector3(0, 0.25, 0)));
  zoneGeo[z.id] = { c, t, r, y, i, plate, zl, W, D };
  nodes.forEach((n, j) => {
    const row = Math.floor(j / 4), colI = j % 4, inRow = Math.min(4, nodes.length - row * 4);
    const p = c.clone().addScaledVector(t, (colI - (inRow - 1) / 2) * GAP).addScaledVector(r, (row - (rows - 1) / 2) * -GAP);
    p.y = y;
    nodeObj[n.id] = { ...makeNode(n, p), n, p };
  });
});

function makeNode(n, p) {
  const g = new THREE.Group(); g.position.copy(p); scene.add(g);
  let body, h = 0.6;
  if (n.kind === K.role) { // a figure on a disc: an agent role
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.08, 32), M.clay(PAL.mist)); base.position.y = 0.04; g.add(base);
    body = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.42, 6, 16), M.clay(PAL.white)); body.position.y = 0.42; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 14), M.gloss(PAL.cardinal)); head.position.y = 0.86; g.add(head);
    h = 1.05;
  } else if (n.kind === K.gate) { // a ring gate with a green light
    body = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.07, 14, 40), M.gloss(PAL.pass)); body.position.y = 0.46; g.add(body);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.1, 10), M.clay(PAL.grey)); post.position.y = 0.05; g.add(post);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), new THREE.MeshStandardMaterial({ color: 0x6fbf8e, emissive: 0x2f7d50, emissiveIntensity: 0.9 }));
    lamp.position.y = 0.46; g.add(lamp); g.userData.lamp = lamp; h = 0.95;
  } else if (n.kind === K.store) { // a cabinet of drawers
    body = new THREE.Mesh(roundBox(0.72, 0.62, 0.52, 0.05), M.clay(PAL.stone)); g.add(body); edge(body, 0x6e6865);
    for (let k = 1; k < 3; k++) { const d = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.012, 0.02), M.clay(PAL.mist)); d.position.set(0, k * 0.2, 0.27); g.add(d); }
    h = 0.75;
  } else if (n.kind === K.compute) { // a stack of units with lights
    for (let k = 0; k < 3; k++) {
      const u = new THREE.Mesh(roundBox(0.66, 0.17, 0.5, 0.04), M.clay(PAL.grey)); u.position.y = k * 0.2; g.add(u); edge(u, 0x3c3e42);
      const led = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.03, 0.01), new THREE.MeshStandardMaterial({ color: 0xff6b5e, emissive: 0xc8473f, emissiveIntensity: 1 }));
      led.position.set(0.2, k * 0.2 + 0.09, 0.255); g.add(led); (g.userData.leds ??= []).push(led);
    }
    body = g.children[0]; h = 0.8;
  } else { // input and outcome: a dark block with a red top
    body = new THREE.Mesh(roundBox(0.7, 0.5, 0.7, 0.08), M.clay(PAL.ink)); g.add(body);
    const top = new THREE.Mesh(roundBox(0.7, 0.06, 0.7, 0.08), M.gloss(PAL.cardinal)); top.position.y = 0.5; g.add(top);
    h = 0.7;
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.userData.nodeId = n.id; } });
  const lab = label(n.title, 'lab', new THREE.Vector3(0, h + 0.28, 0), g);
  lab.element.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
  return { g, lab, h };
}

// central record store: a glass column with rings
{
  const top = 0.25 + 6 * RISE + 1.2;
  const core = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.45, top, 48, 1, true), M.glass()); core.position.y = top / 2; scene.add(core);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.12, 48), M.gloss(PAL.cardinal)); cap.position.y = top; scene.add(cap);
  for (let k = 0; k < 9; k++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.32, 0.018, 8, 64), M.clay(PAL.stone)); ring.rotation.x = Math.PI / 2; ring.position.y = 0.4 + k * (top - 0.6) / 8; scene.add(ring);
  }
  const disks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.8, 0.8, 0.05, 32), M.clay(PAL.mist), 14);
  const m = new THREE.Matrix4(); for (let k = 0; k < 14; k++) { m.makeTranslation(0, 0.2 + k * (top - 0.4) / 13, 0); disks.setMatrixAt(k, m); }
  scene.add(disks);
  label('Records, versions, decisions', 'clab', new THREE.Vector3(0, top * 0.45, 1.6));
  scene.userData.coreTop = top;
}

// ------------------------------------------------------------------------------------------------ flows
const flows = [];
function flow(curve, { count = 14, speed = 0.05, r = 0.075, color = PAL.cardinal, emissive = 0 } = {}) {
  const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 14, 10), new THREE.MeshStandardMaterial({ color, roughness: 0.3, emissive, emissiveIntensity: emissive ? 0.6 : 0 }), count);
  mesh.frustumCulled = false; scene.add(mesh);
  const f = { curve, count, speed, mesh, m: new THREE.Matrix4(), p: new THREE.Vector3(), s: new THREE.Vector3(), q: new THREE.Quaternion() };
  flows.push(f); return f;
}
function tickFlows(t) {
  for (const f of flows) for (let i = 0; i < f.count; i++) {
    const u = (((t * f.speed + i / f.count) % 1) + 1) % 1;
    f.curve.getPointAt(u, f.p); const s = Math.max(1e-4, Math.min(1, Math.sin(Math.PI * u) * 3));
    f.s.set(s, s, s); f.m.compose(f.p, f.q, f.s); f.mesh.setMatrixAt(i, f.m);
  }
  for (const f of flows) f.mesh.instanceMatrix.needsUpdate = true;
}
// the main path through every station in order
const mainPts = NODES.map(n => nodeObj[n.id].p.clone().add(new THREE.Vector3(0, 0.12, 0)));
const mainCurve = new THREE.CatmullRomCurve3(mainPts, false, 'catmullrom', 0.3);
const mainTube = new THREE.Mesh(new THREE.TubeGeometry(mainCurve, 600, 0.022, 8, false), M.clay(PAL.ink));
mainTube.material.transparent = true; mainTube.material.opacity = 0.55; scene.add(mainTube);
flow(mainCurve, { count: 46, speed: 0.012, r: 0.07, color: PAL.ink });
// feedback loops: red arcs over the record store
const loopObjs = LOOPS.map(([a, b, text], k) => {
  const A = nodeObj[a].p.clone().add(new THREE.Vector3(0, nodeObj[a].h, 0)), B = nodeObj[b].p.clone().add(new THREE.Vector3(0, nodeObj[b].h, 0));
  const top = scene.userData.coreTop + 1.4 + k * 0.45;
  const mid = new THREE.Vector3((A.x + B.x) * 0.18, top, (A.z + B.z) * 0.18);
  const curve = new THREE.CubicBezierCurve3(A, new THREE.Vector3(A.x * 0.55, top, A.z * 0.55), new THREE.Vector3(B.x * 0.55, top, B.z * 0.55), B);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 120, 0.028, 8, false), new THREE.MeshStandardMaterial({ color: PAL.cardinal, transparent: true, opacity: 0.6, roughness: 0.4 }));
  scene.add(tube);
  const f = flow(curve, { count: 7, speed: 0.07 + k * 0.006, r: 0.085, color: PAL.ember, emissive: 0x8c1515 });
  const lab = label(text, 'alab', curve.getPointAt(0.24 + 0.1 * (k % 2)).add(new THREE.Vector3(0, 0.25, 0)));
  return { a, b, tube, f, lab, mid };
});

// ------------------------------------------------------------------------------------------------ camera, input
const controls = renderer ? new OrbitControls(camera, renderer.domElement) : null;
const HOME = { pos: new THREE.Vector3(25, 23, 27), target: new THREE.Vector3(0, 2.4, 0) };
camera.position.copy(HOME.pos);
if (controls) { controls.target.copy(HOME.target); controls.enableDamping = true; controls.dampingFactor = 0.07; controls.maxDistance = 60; controls.minDistance = 4; controls.maxPolarAngle = Math.PI * 0.49; }
let camTween = null;
function flyTo(pos, target, dur = 1.4) {
  if (!controls) return;
  camTween = { t: 0, dur: REDUCED ? 0.01 : dur, p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone() };
}
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
function resize() {
  const w = innerWidth, h = innerHeight;
  if (renderer) renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer?.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer?.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => h.object.userData.nodeId);
  if (hit) select(hit.object.userData.nodeId); else closePanel();
});

// ------------------------------------------------------------------------------------------------ panel, focus
const $ = id => document.getElementById(id);
const panel = $('panel');
let selected = null;
function select(id, fly = true) {
  const o = nodeObj[id]; if (!o) return;
  selected = id;
  for (const k in nodeObj) nodeObj[k].lab.element.classList.toggle('sel', k === id);
  const zi = ZONES.findIndex(z => z.id === o.n.zone);
  $('p-zone').textContent = `Tier ${zi + 1}  ${ZONES[zi].name}`;
  $('p-title').textContent = o.n.title; $('p-short').textContent = o.n.short;
  $('p-list').innerHTML = o.n.list.map(s => `<li>${s}</li>`).join('');
  const idx = NODES.findIndex(n => n.id === id);
  const prev = NODES[idx - 1], next = NODES[idx + 1];
  const loopsOut = LOOPS.filter(l => l[0] === id).map(l => `<span data-go="${l[1]}">${nodeObj[l[1]].n.title}</span> (${l[2].toLowerCase()})`);
  const loopsIn = LOOPS.filter(l => l[1] === id).map(l => `<span data-go="${l[0]}">${nodeObj[l[0]].n.title}</span> (${l[2].toLowerCase()})`);
  $('p-links').innerHTML = [
    prev ? `<div><b>From</b> <span data-go="${prev.id}">${prev.title}</span></div>` : '',
    next ? `<div><b>To</b> <span data-go="${next.id}">${next.title}</span></div>` : '',
    loopsOut.length ? `<div><b>Returns to</b> ${loopsOut.join(', ')}</div>` : '',
    loopsIn.length ? `<div><b>Receives from</b> ${loopsIn.join(', ')}</div>` : '',
  ].join('');
  $('p-links').querySelectorAll('[data-go]').forEach(s => s.addEventListener('click', () => select(s.dataset.go)));
  panel.hidden = false;
  focusZone(o.n.zone, false);
  if (fly) { const p = o.p.clone(); const out = zoneGeo[o.n.zone].r; flyTo(p.clone().addScaledVector(out, 6.5).add(new THREE.Vector3(0, 4.2, 0)), p.clone().add(new THREE.Vector3(0, 0.6, 0))); }
}
function closePanel() { panel.hidden = true; selected = null; for (const k in nodeObj) nodeObj[k].lab.element.classList.remove('sel'); }
panel.querySelector('.x').addEventListener('click', closePanel);

function focusZone(zid, loops) {
  for (const k in nodeObj) nodeObj[k].lab.element.classList.toggle('dim', !!zid && nodeObj[k].n.zone !== zid);
  for (const z of ZONES) zoneGeo[z.id].zl.element.classList.toggle('dim', !!zid && z.id !== zid);
  for (const l of loopObjs) {
    const on = loops || !zid || nodeObj[l.a].n.zone === zid || nodeObj[l.b].n.zone === zid;
    l.lab.element.classList.toggle('dim', !on); l.tube.material.opacity = on ? 0.6 : 0.12; l.f.mesh.visible = on;
  }
}

// ------------------------------------------------------------------------------------------------ guided tour
const STEPS = [
  { say: 'The complete workflow. Work moves from a request to a measured improvement. Black flows carry the main path. Red arcs return work to an earlier stage.', zone: null },
  ...ZONES.map(z => ({ say: z.say, zone: z.id })),
  { say: 'The loops make the factory learn. Verified fixes repair the checks. New failures become new intents. Decisions improve the recipe. New weights return to the solvers.', zone: null, loops: true },
];
let step = 0, playing = !REDUCED, stepT = 0;
const dots = $('t-dots');
STEPS.forEach((_, i) => { const d = document.createElement('i'); d.addEventListener('click', () => { playing = false; go(i); }); dots.appendChild(d); });
function go(i) {
  step = (i + STEPS.length) % STEPS.length; stepT = 0;
  const s = STEPS[step];
  $('t-say').textContent = s.say;
  $('t-count').textContent = `${step + 1} of ${STEPS.length}`;
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === step));
  closePanel(); focusZone(s.zone, s.loops);
  if (s.zone) {
    const g = zoneGeo[s.zone];
    flyTo(g.c.clone().addScaledVector(g.r, 9.5).add(new THREE.Vector3(0, 6.5, 0)), g.c.clone().add(new THREE.Vector3(0, 0.5, 0)));
  } else if (s.loops) flyTo(new THREE.Vector3(14, 26, 16), new THREE.Vector3(0, 4.5, 0));
  else flyTo(HOME.pos, HOME.target);
}
$('t-prev').addEventListener('click', () => { playing = false; go(step - 1); });
$('t-next').addEventListener('click', () => { playing = false; go(step + 1); });
$('t-all').addEventListener('click', () => { playing = false; go(0); });
go(0);

// header buttons
let labelsOn = true, spin = false;
$('b-labels').addEventListener('click', e => {
  labelsOn = !labelsOn; e.target.textContent = labelsOn ? 'Hide labels' : 'Show labels';
  labelRenderer.domElement.style.display = labelsOn ? '' : 'none';
});
$('b-spin').addEventListener('click', e => { spin = !spin; e.target.classList.toggle('on', spin); if (controls) { controls.autoRotate = spin; controls.autoRotateSpeed = 0.6; } });

// text version, built from the same data
{
  const t = $('text');
  t.innerHTML = `<h2>The complete workflow</h2><p>A request becomes measured long tasks, trainable environments and a measured improvement. Seven tiers hold ${NODES.length} stations. Feedback loops return work to earlier stations.</p>` +
    ZONES.map((z, i) => `<h3>${i + 1}  ${z.name}</h3><p>${z.say}</p>` + NODES.filter(n => n.zone === z.id).map(n => `<h4>${n.title}</h4><p class="short">${n.short}</p><ul>${n.list.map(s => `<li>${s}</li>`).join('')}</ul>`).join('')).join('') +
    `<h3>Feedback loops</h3><ul>${LOOPS.map(([a, b, x]) => `<li>${x}. ${nodeObj[a].n.title} returns work to ${nodeObj[b].n.title}.</li>`).join('')}</ul>`;
  $('b-text').addEventListener('click', e => { const open = t.classList.toggle('open'); e.target.textContent = open ? 'Live model' : 'Text version'; e.target.classList.toggle('on', open); });
}
if (!renderer) { $('text').classList.add('open'); $('b-text').textContent = 'Live model'; }

// ------------------------------------------------------------------------------------------------ loop
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  if (camTween && controls) {
    camTween.t += dt / camTween.dur; const k = ease(Math.min(1, camTween.t));
    camera.position.lerpVectors(camTween.p0, camTween.p1, k); controls.target.lerpVectors(camTween.t0, camTween.t1, k);
    if (camTween.t >= 1) camTween = null;
  }
  if (!REDUCED) {
    tickFlows(t);
    for (const k in nodeObj) {
      const u = nodeObj[k].g.userData;
      if (u.lamp) u.lamp.material.emissiveIntensity = 0.6 + 0.4 * Math.sin(t * 2.4 + k.length);
      if (u.leds) u.leds.forEach((l, i) => { l.material.emissiveIntensity = (Math.sin(t * 6 + i * 1.7 + k.length) > 0.2) ? 1.2 : 0.2; });
    }
    if (playing && !selected) { stepT += dt; if (stepT > 9) go(step + 1); }
  } else tickFlows(0);
  controls?.update();
  if (renderer) { renderer.render(scene, camera); labelRenderer.render(scene, camera); }
  requestAnimationFrame(frame);
}
renderer?.domElement.addEventListener('pointerdown', () => { playing = false; });
frame();
</script>
</body>
</html>
