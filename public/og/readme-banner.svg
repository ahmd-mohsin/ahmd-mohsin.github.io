<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="glow" cx="76%" cy="14%" r="72%">
      <stop offset="0%" stop-color="#f48fb1" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#070b0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070b0a" stop-opacity="1"/>
      <stop offset="52%" stop-color="#070b0a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#070b0a" stop-opacity="0"/>
    </linearGradient>
    <!-- moving sheen across the name -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-360" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c79bad"/>
      <stop offset="0.5" stop-color="#ffe3f0"/>
      <stop offset="1" stop-color="#c79bad"/>
      <animate attributeName="x1" values="-360;1100" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1460" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1280" height="360" fill="#070b0a"/>

  <!-- breathing background glow -->
  <rect width="1280" height="360" fill="url(#glow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- perspective maze grid on the right -->
  <g stroke="#f48fb1" stroke-opacity="0.16" stroke-width="1">
    <line x1="640" y1="60"  x2="1280" y2="34"/>
    <line x1="604" y1="110" x2="1280" y2="92"/>
    <line x1="566" y1="168" x2="1280" y2="158"/>
    <line x1="524" y1="232" x2="1280" y2="236"/>
    <line x1="486" y1="300" x2="1280" y2="322"/>
    <line x1="700" y1="34"  x2="640" y2="340"/>
    <line x1="820" y1="34"  x2="806" y2="340"/>
    <line x1="940" y1="34"  x2="966" y2="340"/>
    <line x1="1060" y1="34" x2="1122" y2="340"/>
    <line x1="1180" y1="34" x2="1280" y2="340"/>
  </g>

  <!-- pulsing goal + flag -->
  <circle cx="1122" cy="118" r="22" fill="#ff85c0" opacity="0.3" filter="url(#soft)">
    <animate attributeName="r" values="18;32;18" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.12;0.35" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <rect x="1114" y="96" width="4" height="46" fill="#dce3df"/>
  <polygon points="1118,98 1154,109 1118,122" fill="#ff85c0"/>

  <!-- agent A patrolling the grid -->
  <g filter="url(#soft)">
    <rect width="17" height="17" rx="1" fill="#ffb3d6">
      <animateMotion path="M 720,150 L 880,150 L 880,232 L 1030,232 L 1030,150 L 720,150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;1;0.4" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- agent B -->
  <rect width="14" height="14" rx="1" fill="#f48fb1">
    <animateMotion path="M 980,300 L 980,190 L 1120,190 L 1120,120" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;1;0.5" dur="7s" repeatCount="indefinite"/>
  </rect>
  <!-- red mistake blip -->
  <polygon points="0,-6 16,0 0,6" fill="#ff5a7a">
    <animateMotion path="M 830,278 L 900,262" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="3.2s" repeatCount="indefinite"/>
  </polygon>

  <!-- left fade so text stays crisp -->
  <rect width="1280" height="360" fill="url(#fade)"/>

  <!-- text -->
  <text x="70" y="112" font-family="'JetBrains Mono', monospace" font-size="19" letter-spacing="6" fill="#f48fb1">STANFORD AI LAB
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="68" y="198" font-weight="700" font-size="62" fill="url(#shine)">Muhammad Ahmed Mohsin</text>
  <text x="70" y="248" font-style="italic" font-size="25" fill="#c79bad">Reliable reasoning models. RL, preference optimization, agents.</text>
  <text x="72" y="298" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8a6a78">post-training  ·  test-time scaling  ·  coding agents  ·  building alexein.ai</text>

  <rect x="8" y="8" width="1264" height="344" fill="none" stroke="#b07f95" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>
